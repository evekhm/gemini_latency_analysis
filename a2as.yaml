    scope: [agents/latency_analyzer/__init__.py, agents/latency_analyzer/agent.py, agents/latency_analyzer/prompts.py, agents/latency_analyzer/utils.py,
      agents/parallel_latency_analyzer/agent.py, agents/parallel_latency_analyzer/prompts.py, agents/parallel_latency_analyzer/utils.py,
      gemini_logs.py, load_generator.py, run_with_caching.py]
  issued:
    by: A2AS.org
    at: '2026-02-11T16:55:33Z'
    url: https://a2as.org/certified/agents/evekhm/gemini_latency_analysis
