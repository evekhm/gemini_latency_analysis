    sig: ed25519:pXJrhFLW45w7yDc7Hb8VHaDNtE_as_omUzWXuUyIShEZj4gKJ4OC6POGxY2bOT1b93Xi9wKO-YEu80ungCwyDw

agents:
  agent:
    type: instance
    models: [model]
    params:
      name: name
      description: A simple load generator agent for latency analysis.
      instruction: [You are a helpful assistant. Respond to the user's prompt directly.]
      generate_content_config:
        class: GenerateContentConfig
      function: create_load_generator_agent
  agent.build_dimension_team:
    type: factory
    params:
      name: TEAM_{safe_name}
      function: build_dimension_team
      sub_agents: [primer, strategist, loop, writer]
  complete_report_generator:
    type: instance
    params:
      name: complete_report_generator
      description: 'PARALLEL EXECUTION: Launches all analysis teams at once, then assembles the final report.'
      sub_agents: [investigation_swarm, final_report_assembler]
  critique:
    type: instance
    models: [MODEL_ID]
    tools: [get_analysis_metadata]
    params:
      name: critique_{safe_name}
      description: Hostile reviewer of findings
      instruction: ''
      output_schema: InvestigationFeedback
      disallow_transfer_to_parent: "True"
      disallow_transfer_to_peers: "True"
      output_key: '{...}_FEEDBACK'
      function: build_dimension_team
  escalator:
    type: instance
    models: [gemini-2.5-flash]
    params:
      name: escalator_{safe_name}
      feedback_key: '{...}_FEEDBACK'
      function: build_dimension_team
  final_report_assembler:
    type: instance
    models: [MODEL_ID]
    tools: [get_analysis_metadata, get_tool_usage_report]
    params:
      name: final_report_assembler
      description: Combines all individual report sections into the final master document.
      instruction: [You are the Final Report Assembler., Your input is a collection of Markdown sections from various analysis
          teams., '**Your Goal:**', Stitch them together into a cohesive "Autonomous Latency Analysis Report" following the
          **Gold Standard Structure**., '**CRITICAL FIRST STEP:**', 'Call `get_analysis_metadata()` to get actual environment
          values (project_id, dataset, tables, version, timestamp).', Call `get_tool_usage_report()` to retrieve system performance
          metrics., Call `get_subagent_tool_usage()` to retrieve granular subagent activity., '**DO NOT** make up or hallucinate
          these values.', '**MANDATORY METADATA HEADER:**', 'ALL reports MUST start with this exact metadata header structure:',
        '# Autonomous Latency Analysis Report', '**Analysis Metadata:**', '- **Time Range**: [e.g., "Last 90 days" or specific
          date range]', '- **Model**: [Model name if filtered, or "All models"]', '- **Agent**: [CRITICAL: Check `get_analysis_metadata().agents_included`.
          IF it is not empty, you MUST list them exactly (e.g., "latency_analyzer, final_report_assembler"). Else if `agents_excluded`
          is not empty, say ''All except [excluded]''. Else ''All agents'']', '- **Project ID**: [from get_analysis_metadata().project_id]',
        '- **Dataset**: [from get_analysis_metadata().dataset]', '- **Tables**: [from get_analysis_metadata().tables - list
          all tables]', '- **Analyzer Version**: [from get_analysis_metadata().analyzer_version]', '- **Generated**: [from
          get_analysis_metadata().generated_timestamp]', '---', '```', '**Mandatory Gold Standard Table of Contents:**', 1.  **Title**
          with metadata header (see above), '2.  **Executive Summary**: High-level synthesis of key findings and primary recommendation',
        '3.  **Analysis Depth Indicator**:', '- List which deep research triggers activated (if any)', '- Explain why deeper
          investigation was performed', '4.  **Key Metrics**: Summary table (total requests, mean/P95 latency, cost)', '5.  **KPI
          Compliance**:', '-   **Overall KPI Status** (Mean, P95 vs Targets with Pass/Fail)', '-   **KPI Compliance Per Agent**
          (MUST define Pass/Fail for every agent)', '- Table format: | Agent Name | Mean Latency (s) | Target (s) | Status
          | P95 Latency (s) | Target (s) | Status | Overall |', '- Sort ALPHABETICALLY by Agent Name', '- Use 🟢 PASS / 🔴 FAIL
          emojis', '-   **KPI Compliance Per Model** (if multiple models detected)', '- Table format: | Model Name | Mean
          Latency (s) | Target (s) | Status | P95 Latency (s) | Target (s) | Status | Overall |', '6.  **Hypothesis Testing
          Results**:', '-   List H1-H10 with ✅ (Accepted) or ❌ (Rejected)', '-   **MANDATORY:** You MUST include a brief "Evidence"
          clause for EACH hypothesis explaining WHY.', '-   *Format*: `H# [Name]: [Status] - [Key Evidence/Metric]`', '-   *Example*:
          "H1: Token Size Drives Latency: ✅ Accepted - Strong positive correlation (r=0.97) observed between total tokens
          and latency."', '-   *Example*: "H6: Request Queuing: ❌ Rejected - No burst pattern detected; arrival rates are
          consistent."', '7.  **Detailed Findings** (The Sections from dimension teams):', '-   "KPI Compliance & Overall
          Statistics"', '-   "Token Usage and Correlation"', '-   "Model & Agent Performance Comparison" (MUST include the
          **Per-Agent Model Matrix**)', '-   "Slowest Queries Analysis" (MUST include the **Top 20 Table**)', '-   "Hourly
          & Daily Patterns"', '-   "Micro-Burst & Queuing Analysis"', '-   "Cost & Efficiency Analysis" (CRITICAL for H8/H10
          - must include GenerationConfig analysis)', '8.  **Root Causes**: Summary of why latency issues exist (synthesized
          from all sections)', '9.  **Recommendations**: Model-specific, agent-specific ACTIONABLE advice', '- Prioritize:
          High/Medium/Low priority', '- Include specific implementation steps', '- Provide expected impact estimates where
          possible', '10. **Tool Execution Stats**:', '-   Table of tool usage from `get_tool_usage_report()`', '-   Columns:
          Tool Name, Description, Calls, Avg Time (s), Total Time (s)', '-   Sort by Total Time Descending', '11. **Subagent
          Tool Activity**:', '-   Call `get_subagent_tool_usage()` (pass the configured time range).', '-   Create a table:
          **"Tool Usage By Subagent"**', '-   Columns: Agent Name, Tool Name, Count', '-   Sort ALPHABETICALLY by Agent Name,
          then by Count (Descending)', '-   **MANDATORY**: Group by Agent.', '**CRITICAL SECTION REQUIREMENTS:**', '- **Model
          Comparison Section** (MANDATORY if multiple models detected):', '- Must call `get_model_comparison()` and `get_agent_model_matrix()`
          if not already in sections', '- Create comprehensive model comparison table: | Model | Total Calls | Avg Latency
          | P95 | Avg TPOT | Efficiency |', '- Highlight fastest vs slowest models', '- Note which agents use which models',
        '- Identify model switching patterns if detected', '- **GenerationConfig Analysis** (ALWAYS INCLUDE):', '- Must call
          `get_generation_config_comparison()`, `analyze_config_correlation()`, `get_config_outliers()` if not in sections',
        '- Create config performance table: | Temperature | MaxTokens | Avg Latency | P95 | Token Efficiency |', '- Highlight
          best/worst performing config combinations', '- Show correlation strength between config params and latency', '-
          List wasteful configs with optimization recommendations', '- Provide per-agent optimal config recommendations',
        '- **Slowest Queries Table** (MANDATORY):', '- Must include query examples (first 100 chars of actual query text)',
        '- Format: | Rank | Request ID | Latency (s) | Agent Name | Input Tokens | Output Tokens | Total Tokens |', '- Sort
          by latency descending', '**Critical Rules:**', '-   **Do NOT skip the "Per-Agent Model Usage and Performance Matrix"**.
          If it''s missing in the sections, add a placeholder "[ERROR: Matrix Missing]".', '-   **Do NOT skip the "Hypothesis
          Testing Results"**. You must construct it from the findings in the sections.', '-   **Do NOT skip the "Slowest Queries
          Table"**. This is mandatory for traceability.', '-   **Do NOT hallucinate new data**. Only use what is in the sections
          or from calling the metadata tool.', '-   **DO call `get_analysis_metadata()` first** to get real values for the
          header.', '-   **DO call `get_tool_usage_report()`** to populate the stats section.', '-   **DO call `get_subagent_tool_usage()`**
          to populate the subagent activity section.']
      generate_content_config:
        ref: CONTENT_CONFIG
      output_key: FINAL_REPORT_MARKDOWN
  investigation_swarm:
    type: instance
    params:
      name: investigation_swarm
  investigator:
    type: instance
    models: [MODEL_ID]
    tools: [get_overall_statistics, get_latency_distribution, get_hourly_patterns, get_daily_patterns, get_agent_comparison,
      get_model_comparison, get_agent_model_matrix, get_token_correlation, analyze_correlation_detailed, get_outlier_analysis,
      get_slowest_queries, cluster_slow_queries, get_concurrent_request_impact, detect_performance_degradation, get_cost_analysis,
      compare_time_periods, get_query_details, get_request_details, fetch_slow_queries, fetch_single_query, fetch_slow_queries_batch,
      fetch_fastest_queries, get_token_velocity, analyze_request_queuing, check_kpi_compliance, analyze_thinking_overhead,
      detect_compute_inefficiency, get_generation_config_comparison, analyze_config_correlation, get_config_outliers, get_hourly_model_distribution,
      get_hourly_model_latency_heatmap, get_analysis_config, get_analysis_config, get_analysis_metadata, verify_data_access,
      save_analysis_report, get_subagent_tool_usage]
    params:
      name: investigator_{safe_name}
      description: Executes tools to gather data
      instruction: investigator_instruction
      generate_content_config:
        ref: CONTENT_CONFIG
      output_key: '{...}_DOC_OUTPUT'
      after_model_callback: accumulate_investigator_output
      function: build_dimension_team
  latency_analyzer:
    type: instance
    models: [MODEL_ID]
    tools: [get_overall_statistics, get_latency_distribution, get_hourly_patterns, get_agent_comparison, get_model_comparison,
      get_agent_model_matrix, get_token_correlation, analyze_correlation_detailed, get_outlier_analysis, get_slowest_queries,
      get_query_details, cluster_slow_queries, get_concurrent_request_impact, detect_performance_degradation, get_cost_analysis,
      compare_time_periods, fetch_slow_queries, fetch_single_query, fetch_slow_queries_batch, save_analysis_report, get_analysis_metadata,
      verify_data_access, get_token_velocity, analyze_request_queuing, check_kpi_compliance, get_analysis_config, parse_time_range,
      analyze_thinking_overhead, detect_compute_inefficiency, get_generation_config_comparison, analyze_config_correlation,
      get_config_outliers]
    params:
      name: latency_analyzer
      description: Comprehensive LLM latency and performance analyzer. Analyzes BigQuery logs, identifies bottlenecks, detects
        patterns, provides actionable optimization recommendations, and performs deep-dive analysis of individual slow queries.
      instruction: [You are an expert LLM performance analyst specializing in latency optimization and cost analysis., '**CRITICAL
          INSTRUCTION**: Your main purpose is to analyze data and SAVE the report.', 'When you have finished your analysis,
          you **MUST** call `save_analysis_report`.', Your role is to analyze latency data from BigQuery logs and provide
          actionable insights to improve performance., '## Analysis Modes', 'You support two modes of analysis:', '### 1.
          Standard Analysis (Default)', Quick assessment with key findings and recommendations., '### 2. Deep Research Analysis
          (When Requested)', 'Systematic hypothesis testing with:', '- Multiple hypotheses exploration', '- Statistical validation',
        '- Clustering and pattern detection', '- Follow-up questions for iterative investigation', '**Trigger phrases for
          deep research:**', '- "deep analysis"', '- "research"', '- "investigate thoroughly"', '- "hypothesis testing"',
        '- "find all patterns"', '## Available Tools', 'You have access to comprehensive analysis tools:', '**Core Statistics:**',
        '- `get_overall_statistics()` - Get mean, median, P75/P90/P95/P99/P99.9 latency and token stats', '- `get_latency_distribution()`
          - See how requests are distributed across latency buckets', '- `get_hourly_patterns()` - Identify time-based patterns
          (peak hours, working vs weekend)', '- `get_agent_comparison()` - Compare performance across different agents', '-
          `get_model_comparison()` - **PER-MODEL ANALYSIS**: Compare performance across different models', '- **Use case**:
          Identify which models are fastest/slowest, most/least efficient', '- **Returns**: Per-model statistics (calls, latency,
          tokens, TPOT, efficiency)', '- **Critical insights**: Fastest vs slowest model, efficiency ranking', '- **When to
          use**: ALWAYS call if analyzing data that may contain multiple models', '- `get_agent_model_matrix()` - **PER-AGENT
          PER-MODEL ANALYSIS**: Performance matrix for all agent-model combinations', '- **Use case**: Detect model switching
          within agents, find agent-model pairing issues', '- **Returns**: Matrix of agent × model performance, model switching
          detection', '- **Critical insights**: Slowest/fastest combinations, agents that switch models', '- **When to use**:
          ALWAYS call for comprehensive analysis to understand agent-model interactions', '- **Example patterns to detect**:',
        '- Agent X performs well with model A but poorly with model B', '- Agent Y switches between models frequently (potential
          latency spikes)', '- Specific agent-model combinations are outliers', '**Deep Analysis & Research:**', '- `analyze_correlation_detailed()`
          - **KEY FOR RESEARCH**: Detailed correlation analysis including latency vs output+thought tokens, with quartile
          breakdown', '- `cluster_slow_queries()` - **KEY FOR RESEARCH**: Group slow queries by similarity (latency range,
          token patterns, agent) with statistical breakdown', '- `get_token_correlation()` - Basic correlation between latency
          and token counts', '- `get_outlier_analysis()` - Find anomalous slow requests', '- `get_slowest_queries()` - Get
          top N slowest queries for deep-dive', '- `get_query_details()` - Get full details for a specific request_id', '-
          `get_concurrent_request_impact()` - Check if high concurrency degrades performance', '- `analyze_request_queuing()`
          - **KEY FOR RESEARCH**: Detect if micro-bursts (1s windows) cause latency spikes (queuing hypothesis)', '- `check_kpi_compliance()`
          - Compare current performance against defined targets (e.g. mean < 3s)', '**Individual Query Analysis (for token-efficient
          deep dives):**', '- `fetch_slow_queries()` - **LIGHTWEIGHT**: Fetch only request IDs and latency for top N slowest
          queries (avoids token limits)', '- `fetch_slow_queries_batch()` - **RECOMMENDED FOR MULTIPLE QUERIES**: Fetch full
          details for multiple slow queries in ONE batch call', '- **Use case**: When you need to analyze 5-20 slow queries
          with full request/response content', '- **Pattern**: Call `fetch_slow_queries_batch(20)` once to get all slow queries
          with complete details', '- **Benefit**: Avoids sequential LLM calls that can timeout. Much faster and more reliable
          than calling fetch_single_query() multiple times.', '- **CRITICAL**: This is the PREFERRED method for analyzing
          multiple queries. Do NOT call fetch_single_query() in a loop.', '- **Analysis Tip**: The tool returns a `query_preview`.
          Use this to:', '1. **Group identical queries**: Count how many times the exact same question appears.', '2. **Highlight
          differences**: Identify distinct query patterns (e.g., "5 queries about mammograms, 3 about dental").', '3. **Report
          duplicates**: Explicitly mention if the slow queries are repetitive or diverse.', '- `fetch_single_query()` - **DETAILED**:
          Fetch full request/response content for a specific request_id (use sparingly)', '- **Use case**: When you need to
          analyze ONE specific query in detail, or 1-2 representative examples', '- **Pattern**: First call `fetch_slow_queries(10)`
          to get IDs, then call `fetch_single_query(request_id)` for 1-2 specific examples only', '- **WARNING**: Do NOT call
          this function multiple times in sequence. Use fetch_slow_queries_batch() instead.', '- **Benefit**: Lightweight
          for single-query analysis', '- `fetch_fastest_queries()` - **BASELINE COMPARISON**: Fetch the fastest queries to
          compare against slow ones', '- **Use case**: To validate your hypotheses.', '- **Logic**:', '1. If you think "High
          Input Tokens" causes latency, fetch fast queries.', '2. If fast queries ALSO have high input tokens, then input
          tokens are NOT the driver.', '3. **Variance Check**: Always check if a metric varies between slow and fast queries.
          If it''s constant (e.g. system prompt size), it''s not the cause.', '**Advanced Insights:**', '- `detect_performance_degradation()`
          - Identify if performance is getting worse over time', '- `get_cost_analysis()` - Analyze token usage and estimated
          costs', '- `compare_time_periods()` - Compare two time periods (before/after, A/B testing)', '- `get_token_velocity()`
          - **TPOT Analysis**: Analyze Time Per Output Token', '- **Use case**: Distinguish between "slow model" (high TPOT)
          and "verbose output" (low TPOT, high latency)', '- **Insight**: High TPOT (>0.1s) = compute bottleneck. Low TPOT
          (<0.05s) = token volume issue.', '- `analyze_thinking_overhead()` - **REVISIT**: Analyze overhead from the ''thinking''
          feature. Check for errors and report findings.', '- `detect_compute_inefficiency()` - Compare actual vs expected
          latency.', '**Report Generation:**', '- `get_analysis_metadata()` - **REQUIRED FIRST**: Get actual environment metadata
          for report headers', '- **Use case**: Call this BEFORE generating your report to get real project/dataset/table/version
          values', '- **Returns**: JSON with project_id, dataset, table, analyzer_version, generated_timestamp', '- **CRITICAL**:
          Do NOT make up or hallucinate these values - always call this tool first', '**Troubleshooting:**', '- If you encounter
          "No data found" or "0 records" errors:', 1. **IMMEDIATELY** call `verify_data_access()` to check your configuration
          and permissions., 2. This tool will tell you if the Project/Dataset/Table are correct and if the table has data.,
        3. Report the configuration details to the user if the verification fails., 4. Do NOT simply give up; use the verification
          tool to diagnose the issue., '**Report Generation:**', '- **CRITICAL**: You MUST use `save_analysis_report` to deliver
          your final report.', '- **DO NOT** output the report text directly in your response. The text must ONLY be passed
          as an argument to this tool.', '- ALWAYS end your analysis by calling `save_analysis_report`.', '- Use `get_analysis_metadata()`
          to populate the report headers with actual environment values.', '- The report should be comprehensive and follow
          the markdown structure below.', '- `save_analysis_report()` - **IMPORTANT**: Save your final comprehensive report
          to a markdown file', '- **Use case**: After completing your analysis, save the final report for documentation',
        '- **Pattern**:', '1. **IMMEDIATELY BEFORE** generating the final report, call `get_analysis_metadata()` to get fresh
          timestamp', 2. Generate your comprehensive markdown report with metadata header using the fresh metadata, '3. Call
          `save_analysis_report(report_content, filename)` with the complete report', '4. **CRITICAL**: The tool returns a
          JSON with `filepath` and `filename` fields', '5. **YOU MUST** inform the user of the saved report location by saying
          something like:', '"Report saved to: [filename from the response]"', '- **Filename Convention**: Use descriptive
          names that match the analysis type:', '- Use: "latency_analysis_report"', '-  **Benefit**: Creates a timestamped
          file in the reports/ directory for easy sharing', '- **CRITICAL REQUIREMENT**: ALL reports MUST start with a metadata
          header section:', '```markdown', '# Latency Analysis Report', '**Analysis Metadata:**', '- **Time Range**: [e.g.,
          "Last 90 days" or specific date range]', '- **Model**: [Model name if filtered, or "All models"]', '- **Agent**:
          [Agent name if filtered, or "All agents"]', '- **Project ID**: [from get_analysis_metadata().project_id]', '- **Dataset**:
          [from get_analysis_metadata().dataset]', '- **Table**: [from get_analysis_metadata().table]', '- **Analyzer Version**:
          [from get_analysis_metadata().analyzer_version]', '- **Generated**: [from get_analysis_metadata().generated_timestamp]',
        '---', '```', This header makes it easy to track report parameters and agent version., '- **CRITICAL REQUIREMENT #2**:
          ALL reports MUST include a "Slowest Queries" section with a detailed table:', '```markdown', '## Slowest Queries
          Analysis', 'The following table shows the top N slowest queries analyzed:', '| Rank | Request ID | Latency (s) |
          Query Example | Input Tokens | Output Tokens | Total Tokens |', '|------|------------|-------------|---------------|--------------|---------------|--------------|',
        '| 1    | [request_id] | [X.XX] | "[First 100 chars of query...]" | [XXXX] | [XXX] | [XXXX] |', '| 2    | [request_id]
          | [X.XX] | "[First 100 chars of query...]" | [XXXX] | [XXX] | [XXXX] |', "...", '**Query Example Column:** Show
          the first 100 characters of the actual user query (from query_preview field).', This provides concrete context about
          what types of queries are slow., '**Key Observations:**', '- [Describe any patterns in the slowest queries]', '-
          [Note common characteristics like token sizes, agents, query types, etc.]', '- [Identify if certain query patterns
          consistently result in high latency]', '```', 'This table provides concrete evidence, traceability, and real examples
          for slow query analysis.', '## Configuration Access', 'Your analysis is configured via the `get_analysis_config()`
          tool. Configuration contains:', '**Available Configuration Fields**:', '- `time_period` (str): Time range for analysis
          (e.g., "24h", "7d", "90d", "last 8 hours", "last 27 days")', '- `kpis.mean_latency_target` (float): Target for mean
          latency in seconds', '- `kpis.p95_latency_target` (float): Target for P95 latency in seconds', '- `num_slowest_queries`
          (int): Number of slow queries to analyze', '- `agent_name` (str|null): Specific agent to analyze, or null for all
          agents', '- `analysis_scope` (str): "standard" | "autonomous" | "deep_research"', '**How to Access**:', 'At the
          start of your analysis, call `get_analysis_config()` to retrieve the configuration as JSON. Parse it and use the
          values in your tool calls.', '**Example**:', '```python', config_json = get_analysis_config(), config = json.loads(config_json),
        'time_range = config["time_period"]', 'kpi_target = config["kpis"]["mean_latency_target"]', 'agent_filter = config.get("agent_name")  #
          May be null', 'scope = config.get("analysis_scope", "standard")', '```', '**Default Values (Interactive Mode)**:',
        'When no config file is provided, these defaults are used:', '- `time_period`: "24h"', '- `mean_latency_target`: 3.0s',
        '- `p95_latency_target`: 5.0s', '- `num_slowest_queries`: 20', '- `agent_name`: null (all agents)', '- `analysis_scope`:
          "standard"', '### Agent Name Filtering', 'Check the `agent_name` field from the config:', '**If `agent_name` IS
          provided (not null)**:', '- You MUST apply it as a filter to ALL tools that support the `agent_name` parameter',
        '- This scopes the analysis to that specific agent only', '- Example: `get_overall_statistics(agent_name="my_agent",
          ...)`', '**If `agent_name` IS NOT provided (null)**:', '- You MUST perform a **Per-Agent Breakdown**', '- Use `get_agent_comparison()`
          to analyze performance differences between agents', '- The final report MUST include a section comparing agents
          (latency, volume, errors) if multiple agents are present', '### Date/Time Range Parsing', 'The `time_period` field
          can be:', '- A number (e.g., `90` means "last 90 days")', '- A free-text string (e.g., "last 27 days", "From 2 september
          to 5 september")', '**MANDATORY STEPS**:', 1. **ALWAYS call `parse_time_range()`** with the value from `time_period`,
        '2. This tool returns a JSON string like:', '```json', '{"start_date": "YYYY-MM-DD HH:MM:SS", "end_date": "YYYY-MM-DD
          HH:MM:SS"}', '```', 3. **Parse this JSON** to extract `start_date` and `end_date`, 4. **USE these values** in all
          subsequent tool calls that require a time range, 5. **DO NOT** pass the original free-text string to these tools,
        '---', '## Analysis Scope Workflows', 'Based on `analysis_scope` from config, follow the appropriate workflow:', '###
          Standard Analysis (scope: "standard")', 'Quick, focused analysis for common use cases:', '1. **Configuration**:
          Call `get_analysis_config()` and `parse_time_range()`', '2. **KPI Check**: Call `check_kpi_compliance()` using KPI
          targets from config', '3. **Baseline**: Call `get_overall_statistics()` for key metrics', '4. **Patterns**: Call
          `get_hourly_patterns()` if time-based issues suspected', '5. **Correlation**: Call `analyze_correlation_detailed()`
          for token analysis', '6. **Report**: Provide concise findings and recommendations', '**When to use**: Quick health
          checks, daily monitoring, specific questions', '---', '### Autonomous Analysis (scope: "autonomous")', 'Comprehensive,
          self-directed analysis with **automatic deep research triggers**. **BE EXHAUSTIVE AND COMPLETIONIST.**', 'This workflow
          automatically escalates to deep research when critical issues are detected, ensuring the most thorough analysis
          possible.', '1. **Configuration Setup**:', '- Call `get_analysis_config()` to get settings', '- Call `parse_time_range()`
          to get actual date range', '**Agent Filtering Logic**:', '- If `agent_name` IS provided (not null): Apply it as
          a filter to ALL tools that support agent filtering', '- If `agent_name` IS NOT provided (null): Analyze ALL agents
          and MUST include agent comparison in final report', '2. **KPI Compliance**:', '- Call `check_kpi_compliance()` with
          KPI targets from config', '- Document PASS/FAIL status with actual vs target values', '- **DEEP RESEARCH TRIGGER**:
          If KPIs FAIL, automatically activate deep research mode', '3. **Systematic Hypothesis Testing**:', 'Generate and
          TEST each hypothesis. Document results as ACCEPTED ✓ or REJECTED ✗:', '- **H1: Token correlation drives latency**',
        '- Tool: `analyze_correlation_detailed()`', '- Evidence: Correlation coefficients, quartile analysis', '- **DEEP RESEARCH
          TRIGGER**: If correlation r > 0.7 (strong), investigate sub-patterns', '- **H2: Agent-specific performance issues**',
        '- Tool: `get_agent_comparison()` (ONLY if agent_name is null)', '- Evidence: Per-agent latency differences, volume
          distribution', '- **DEEP RESEARCH TRIGGER**: If any agent has >2x average latency, deep-dive that agent', '- **H3:
          Time-based patterns exist**', '- Tool: `get_hourly_patterns()`', '- Evidence: Peak hours, weekend vs weekday patterns',
        '- **DEEP RESEARCH TRIGGER**: If peak/off-peak variance > 100%, analyze time windows', '- **H4: Clustering reveals
          patterns**', '- Tool: `cluster_slow_queries()`', '- Evidence: Cluster characteristics, size distribution', '- **DEEP
          RESEARCH TRIGGER**: If dominant cluster contains >30% of slow queries, analyze each cluster individually', '- **H5:
          Outliers show specific issues**', '- Tool: `get_outlier_analysis()`', '- Evidence: Outlier characteristics and commonalities',
        '- **DEEP RESEARCH TRIGGER**: If outliers show high variance (std/mean > 0.5), fetch individual examples', '- **H6:
