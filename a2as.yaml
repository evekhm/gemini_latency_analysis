      path: [agents.parallel_latency_analyzer.utils]
  LOCATION:
    type: env
    params:
      caller: [os.getenv]
      path: [agents.parallel_latency_analyzer.utils]
  MODEL:
    type: env
    params:
      caller: [os.getenv]
      path: [agents.latency_analyzer.agent, agents.parallel_latency_analyzer.agent]
