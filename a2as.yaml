          <30%)', '- **DEEP RESEARCH TRIGGERS**:', '- If temperature correlation |r| > 0.4 → Analyze temperature impact in
          detail', '- If maxOutputTokens correlation |r| > 0.4 → Investigate token limit effects', '- If >20% of requests
          have token efficiency <30% → Focus on wasteful configs', '- If best vs worst config combinations differ by >50%
          latency → Recommend optimal settings', '- **Analysis Requirements**:', '- Always run this analysis regardless of
          other findings', '- Identify optimal temperature and maxOutputTokens per agent', '- Detect and quantify waste from
          over-provisioned settings', '- Provide specific config recommendations (e.g., "Reduce maxOutputTokens from 8192
          to 2048 for agent X")', '**Analysis Framework:**', 'Follow this systematic 5-phase approach when generating questions:',
        '1. **Health Check**: Questions about KPI compliance and overall statistics', '2. **Pattern Detection**: Questions
          about hourly/daily patterns and distribution', '3. **Root Cause Analysis**: Questions about correlation, clustering,
          outliers', '4. **Cost & Efficiency**: Questions about token usage, TPOT, config impact', '5. **Recommendations**:
          Questions that lead to actionable insights', '**Your Goal:**', 'Develop a scientific plan to investigate this dimension.
          You generally follow the "Outlier-First" approach:', '1.  **Overview**: Establish the baseline (mean/p95).', '2.  **Outliers**:
          Identify segments that deviate (specific agents, models, or hours).', '3.  **Why**: Dig into the *cause* of those
          deviations.', '**Guidelines for Rigorous Analysis:**', '- **Hypothesis Testing**: For every suspected issue, formulating
          a plan to VALIDATE it (Accept/Reject).', '- *Example*: "Hypothesis: High token counts drive latency. Test: Correlate
          tokens vs latency and check if high-token clusters exist."', '- **Baseline Comparison**: Always ask for comparisons
          against "fastest queries" or "baseline performance" to prove significance.', '- **CRITICAL**: Direct the Investigator
          to use `fetch_fastest_queries()` to validate hypotheses.', '- **Logic**: If you suspect "High Input Tokens" causes
          latency, compare slow vs fast queries. If fast queries ALSO have high input tokens, then input tokens are NOT the
          driver.', '- **Variance Check**: Always verify if a metric varies between slow and fast queries. If it''s constant
          (e.g. system prompt size), it''s not the cause.', '- **Counter-Hypothesis**: Trigger checks for alternative explanations
          (e.g., "If it''s not tokens, is it the model?").', '- Test counter-hypotheses to eliminate false positives', '-
          Example: "If correlation is weak, test if time-based patterns or model choice explains the variance instead."',
        '- **Model Specificity**: Explicitly ask the Investigator to identify WHICH models are performing poorly. Check the
          `model` field.', '- **Deep Dives**: If a specific agent or cluster is identified, explicitly request a "deep dive"
          into that entity (e.g., "Analyze the ''writer'' agent''s slowest queries").', '**MANDATORY STRATEGY MAP:**', 'You
          MUST include these specific directives if the dimension matches:', '1.  **"KPI Compliance & Overall Statistics"**:',
        '-   "Calculate strict Pass/Fail status for every agent using `check_kpi_compliance`."', '-   "Compare overall performance
          vs targets using `get_overall_statistics`."', '2.  **"Model & Agent Performance Comparison"**:', '-   "Generate
          the full Agent-Model Matrix using `get_agent_model_matrix`."', '-   "Compare Model A vs Model B performance using
          `get_model_comparison`."', '-   "Generate per-agent token usage statistics (Input/Output/Thought) using `get_agent_comparison`."',
        '-   "QUESTION: What is the token usage breakdown per agent? Run `get_agent_comparison` to populate the mandatory
          Token Usage table."', '3.  **"Slow Query Deep Dive"**:', '-   "Fetch the top 20 slowest queries using `fetch_slow_queries_batch`
          (PREFERRED for batch analysis)."', '-   "Analyze the specific prompt text of the slowest queries."', '-   "Use `fetch_fastest_queries()`
          to compare against baseline and validate findings."', '4.  **"Token Usage & Correlation"**:', '-   "Run `analyze_correlation_detailed`
          to test H1 (Token Size)."', '-   "Check `get_token_velocity` for H1/H7 (TPOT & Thinking Overhead)."', '-   "Run
          `analyze_thinking_overhead` to test H7 (Thinking Feature)."', '-   "Validate with `fetch_fastest_queries()` to check
          if high-token fast queries exist."', '5.  **"Cost & Efficiency Analysis"**:', '-   "Run `detect_compute_inefficiency`
          to test H8 (Anomalous Inefficiency)."', '-   "Run `analyze_config_correlation` to test H10 (Configuration Impact)."',
        '-   "Run `get_generation_config_comparison` to identify optimal settings."', '-   "Run `get_config_outliers` to find
          wasteful configurations."', '**Output Format:**', Return a bulleted list of 3-5 specific analytical questions or
          directives that guide the Investigator to `confirm` or `refute` specific hypotheses.]
      generate_content_config:
        ref: CONTENT_CONFIG
      output_key: '{...}_STRAT_OUTPUT'
      function: build_dimension_team
  writer:
    type: instance
    models: [MODEL_ID]
    params:
      name: writer_{safe_name}
      description: Writes final section markdown
      instruction: ''
      generate_content_config:
        ref: CONTENT_CONFIG
      output_key: SECTION_{...}
      function: build_dimension_team

models:
  gemini-2.5-flash:
    type: default
    agents: [escalator]
  model:
    type: literal
    agents: [agent]
  MODEL_ID:
    type: literal
    agents: [latency_analyzer, primer, strategist, investigator, critique, writer, final_report_assembler, markdown_corrector,
      report_saver, parallel_latency_analyzer]

tools:
  analyze_config_correlation:
    type: function
    agents: [latency_analyzer, investigator]
    params:
      description: "Analyze correlation between generation config parameters and latency.\n\nCalculates correlation coefficients\
        \ for:\n- Temperature vs latency\n- maxOutputTokens vs latency\n- topK vs latency (if available)\n- topP vs latency\
        \ (if available)\n\nArgs:\n    time_range: Time range to analyze (default: \"all\")\n    agent_name: Filter by specific\
        \ agent (optional)\n    model_name: Filter by specific model (optional)\n    \nReturns:\n    JSON string with correlation\
        \ analysis and scatter plot data"
  analyze_correlation_detailed:
    type: function
    agents: [latency_analyzer, investigator]
    params:
      description: |-
        Detailed correlation analysis including output+thought tokens.

        Provides comprehensive correlation matrix and statistical significance.
  analyze_request_queuing:
    type: function
    agents: [latency_analyzer, investigator]
    params:
      description: |-
        Analyze if latency spikes are caused by request queuing (micro-bursts).

        Checks if multiple requests arriving within a small window (e.g. 1s)
        lead to increased latency, suggesting a queuing mechanism is delaying execution.
  analyze_thinking_overhead:
    type: function
    agents: [latency_analyzer, investigator]
    params:
      description: |-
        Analyze 'thinking' feature overhead by examining thought token patterns.

        Identifies queries where thinking dominates the response:
        - High thought/output ratio (>5:1 indicates heavy thinking)
        - Unexpectedly high thought tokens for simple queries
        - Correlation between thought tokens and latency

        Returns:
            JSON with thinking patterns, ratios, and recommendations
  check_kpi_compliance:
    type: function
    agents: [latency_analyzer, investigator]
    params:
      description: |-
        Check if current performance meets defined KPIs.

        Args:
            time_range: Time range to analyze (defaults to config or "all")
            mean_latency_target: Target for mean latency (defaults to config or 3.0)
            p95_latency_target: Target for P95 latency (defaults to config or 5.0)
            agent_name: Filter by specific agent (defaults to config or None)
            model_name: Filter by specific model (optional)
  cluster_slow_queries:
    type: function
    agents: [latency_analyzer, investigator]
    params:
      description: |-
        Cluster slow queries by similarity and provide breakdown.

        Groups queries by common characteristics:
        - Similar latency ranges
        - Similar token patterns (input/output/thought)
        - Same agent
        - Time-based patterns

        Returns clusters with representative examples and statistics.
  compare_time_periods:
    type: function
    agents: [latency_analyzer, investigator]
    params:
      description: |-
        Compare performance between two time periods.

        Useful for before/after analysis or A/B testing validation.
  detect_compute_inefficiency:
    type: function
    agents: [latency_analyzer, investigator]
    params:
      description: |-
        Compare actual latency to expected latency to detect compute bottlenecks.

        Expected latency model:
        - Prefill: 0.0005s per input token
        - Decode: 0.05s per output token (baseline 20 t/s)
        - Fixed overhead: 0.5s

        Flags queries where Actual > 5x Expected.
  detect_performance_degradation:
    type: function
    agents: [latency_analyzer, investigator]
    params:
      description: |-
        Detect performance degradation over time using moving averages.

        Compares recent performance to baseline to identify trends.
  fetch_fastest_queries:
    type: function
    agents: [investigator]
    params:
      description: "Fetches multiple FASTEST queries (low latency) to serve as a baseline.\n\nUse this to compare against\
        \ slow queries. If a factor (like input tokens) \nis high in BOTH slow and fast queries, it is NOT the driver of latency.\n\
        \nArgs:\n    num_queries: Number of fastest queries to fetch (default: 20)\n    time_range: Time range to search (default:\
        \ \"all\")\n    model_name: Optional model name filter\n    \nReturns:\n    JSON string with array of query details\
        \ including full request/response"
  fetch_single_query:
    type: function
    agents: [latency_analyzer, investigator]
    params:
      description: "Fetches a single query's full details by request_id.\n\nThis allows deep-dive analysis of individual slow\
        \ queries with full\nrequest/response content. Use this after fetch_slow_queries to analyze\nspecific queries one\
        \ at a time to avoid token limits.\n\nArgs:\n    request_id: The request ID to fetch.\n    \nReturns:\n    A JSON\
        \ string containing the full query details."
  fetch_slow_queries:
    type: function
    agents: [latency_analyzer, investigator]
    params:
      description: "Fetches the top N slowest queries from the BigQuery logs and returns metadata only.\n\nThis is a lightweight\
        \ version that returns only request IDs and latency,\navoiding token limits when dealing with large request/response\
        \ payloads.\n\nArgs:\n    num_records: The number of records to fetch. Defaults to 10.\n    agent_name: Filter by\
        \ specific agent (optional)\n    \nReturns:\n    A JSON string containing the count and list of request IDs with latency."
  fetch_slow_queries_batch:
    type: function
    agents: [latency_analyzer, investigator]
    params:
      description: "Fetches multiple slow queries with full details in a SINGLE batch query.\n\nThis is the RECOMMENDED approach\
        \ instead of calling fetch_single_query() \nmultiple times, as it:\n- Avoids sequential LLM calls that can timeout\n\
        - Fetches all data in one BigQuery query\n- Returns complete information for analysis\n\nUse this function when you\
        \ need to analyze multiple slow queries.\nOnly use fetch_single_single_query() for 1-2 specific examples.\n\nArgs:\n\
        \    num_queries: Number of slowest queries to fetch (default: 20)\n    time_range: Time range to search (default:\
        \ \"all\")\n    model_name: Optional model name filter\n    agent_name: Optional agent name filter\n    \nReturns:\n\
        \    JSON string with array of query details including full request/response"
  get_agent_comparison:
    type: function
    agents: [latency_analyzer, investigator]
    params:
      description: |-
        Compare performance across different agents.

        Returns per-agent statistics including calls, latency, and token usage.
  get_agent_model_matrix:
    type: function
    agents: [latency_analyzer, investigator]
    params:
      description: "Get performance matrix for all agent-model combinations.\n\nThis provides a comprehensive view of how\
        \ each agent performs with each model,\nenabling detection of:\n- Agent-specific model preferences\n- Model switching\
        \ impacts per agent\n- Agent-model combinations that are problematic\n\nArgs:\n    time_range: Time range to analyze\n\
        \    \nReturns:\n    JSON string with agent-model performance matrix"
  get_analysis_config:
    type: function
    agents: [latency_analyzer, investigator, parallel_latency_analyzer]
    params:
      description: |-
        Reads the analysis configuration from config files (.json).

        This tool reads configuration parameters like time_period, KPIs, agent_name,
        num_slowest_queries, and analysis_scope from the config file.

        NOTE: As of the refactoring, workflow logic has been moved to the system prompt.
        The agent should read the config and use analysis_scope to determine which workflow
        to follow (standard, autonomous, or deep_research).

        Returns:
            JSON string containing the configuration (time period, KPIs, agent filter, analysis_scope, etc.).
  get_analysis_metadata:
    type: function
    agents: [latency_analyzer, investigator, critique, final_report_assembler]
    params:
      description: |-
        Get metadata about the analysis environment for report headers.

        Returns actual values from environment variables to avoid hallucination.
        Use this tool when generating report metadata headers.

        Returns:
            JSON string with project_id, dataset, table, and analyzer version
  get_concurrent_request_impact:
    type: function
    agents: [latency_analyzer, investigator]
    params:
      description: |-
        Analyze impact of concurrent requests on latency.

        Groups requests into time buckets and correlates concurrency with latency.
  get_config_outliers:
    type: function
    agents: [latency_analyzer, investigator]
    params:
      description: "Identify requests with suboptimal generation config settings.\n\nDetects:\n- Requests with maxOutputTokens\
        \ much higher than actual output (wasteful)\n- Queries with potentially inappropriate temperature settings\n- Over-provisioned\
        \ configurations\n\nArgs:\n    time_range: Time range to analyze (default: \"all\")\n    threshold_efficiency: Efficiency\
        \ threshold (output/max_output) below which to flag (default: 0.3)\n    \nReturns:\n    JSON string with config outliers\
        \ and optimization recommendations"
  get_cost_analysis:
    type: function
    agents: [latency_analyzer, investigator]
    params:
      description: |-
        Analyze token usage and estimated costs.

        Provides cost breakdown by agent and identifies expensive operations.
  get_daily_patterns:
    type: function
    agents: [investigator]
    params:
      description: |-
        Get daily latency patterns including P95 and Day-of-Week breakdown.

        Returns:
            JSON string with daily statistics (request count, p50, p95, avg latency)
            grouped by Day of Week (1=Sunday, 2=Monday, ..., 7=Saturday).
  get_generation_config_comparison:
    type: function
    agents: [latency_analyzer, investigator]
    params:
      description: "Compare latency performance across different generation config settings.\n\nGroups requests by temperature\
        \ and maxOutputTokens to identify which\nconfigurations lead to better or worse latency performance.\n\nArgs:\n  \
        \  time_range: Time range to analyze (default: \"all\")\n    agent_name: Filter by specific agent (optional)\n   \
        \ model_name: Filter by specific model (optional)\n    \nReturns:\n    JSON string with per-config performance comparison"
  get_hourly_model_distribution:
    type: function
    agents: [investigator]
    params:
      description: |-
        Get hourly request distribution broken down by model.
        Use this to see if different models are used at different times of day.
  get_hourly_model_latency_heatmap:
    type: function
    agents: [investigator]
    params:
      description: |-
        Get hourly latency statistics broken down by model.
        Use this to visualize if specific models get slower at specific times.
        Returns Avg and P95 latency per (Hour, Model).
  get_hourly_patterns:
    type: function
    agents: [latency_analyzer, investigator]
    params:
      description: |-
        Get hourly latency patterns including working vs weekend comparison.

        Returns hourly averages, request counts, and identifies peak hours.
  get_latency_distribution:
    type: function
    agents: [latency_analyzer, investigator]
    params:
      description: |-
        Get latency distribution categorized into buckets.

        Returns histogram data showing how many requests fall into each latency category.
  get_model_comparison:
    type: function
    agents: [latency_analyzer, investigator]
    params:
      description: "Compare performance across different models.\n\nExtracts model name from the model field (e.g., \"publishers/google/models/gemini-2.5-pro\"\
        )\nand returns per-model statistics including calls, latency, and token usage.\n\nArgs:\n    time_range: Time range\
        \ to analyze\n    agent_name: Filter by specific agent (optional)\n    \nReturns:\n    JSON string with per-model\
        \ performance comparison"
  get_outlier_analysis:
    type: function
    agents: [latency_analyzer, investigator]
    params:
      description: |-
        Identify outlier requests (latency > threshold * std dev).

        Returns list of outlier requests with full details.
  get_overall_statistics:
    type: function
    agents: [latency_analyzer, investigator]
    params:
      description: "Get overall latency and token statistics with comprehensive percentile breakdown.\n\nReturns mean, median,\
        \ P75, P90, P95, P99, P99.9 latency percentiles for\ncomplete distribution analysis.\n\nArgs:\n    time_range: Time\
        \ range to analyze (e.g., \"24h\", \"7d\", \"2025-01-01 to 2025-01-31\")\n    model_name: Filter by specific model\
        \ (optional)\n    agent_name: Filter by specific agent (optional)\n    \nReturns:\n    JSON string with overall statistics\
        \ including all percentiles"
  get_query_details:
    type: function
    agents: [latency_analyzer, investigator, parallel_latency_analyzer]
    params:
      description: |-
        Get full details for a specific query by request_id.

        This allows deep-dive analysis of individual slow queries.
        Merged from slow_query_analyzer's fetch_single_query.
  get_request_details:
    type: function
    agents: [investigator, parallel_latency_analyzer]
  get_slowest_queries:
    type: function
    agents: [latency_analyzer, investigator]
    params:
      description: |-
        Get the N slowest queries with full details for deep analysis.

        This is the merged functionality from slow_query_analyzer.
        Returns request IDs and metadata for the slowest queries.
  get_subagent_tool_usage:
    type: function
    agents: [investigator, parallel_latency_analyzer]
    params:
      description: "Get tool usage statistics broken down by subagent from BigQuery records.\n\nArgs:\n    time_range: Time\
        \ range to analyze (e.g., \"24h\", \"7d\")\n    agent_name: Optional filter for specific subagent name\n    \nReturns:\n\
        \    JSON string with tool usage counts per agent"
  get_token_correlation:
    type: function
    agents: [latency_analyzer, investigator]
    params:
      description: |-
        Analyze correlation between latency and token counts.

        Returns correlation coefficients and scatter plot data.
  get_token_velocity:
    type: function
    agents: [latency_analyzer, investigator]
    params:
      description: |-
        Analyze Time Per Output Token (TPOT) to distinguish between slow generation and verbose output.

        TPOT = Latency / Output Tokens

        High TPOT (> 0.1s/token) indicates compute bottlenecks (model struggling).
        Low TPOT (< 0.05s/token) but high latency indicates verbose output (generating too much text).
  get_tool_usage_report:
    type: function
    agents: [final_report_assembler]
    params:
      description: |-
        Get a summary of tool usage statistics for the report.

        Returns:
            JSON string with tool execution counts, average durations, and descriptions.
  has_report_content:
    type: function
    agents: [parallel_latency_analyzer]
    params:
      description: Checks if there is any generated report content in the session state.
  parse_time_range:
    type: function
    agents: [latency_analyzer]
    params:
      description: |-
        Parse time range string into start and end timestamps.

        Supports formats:
        - "24h", "7d" (last N hours/days)
        - "24h ago", "7d ago" (relative past)
        - "YYYY-MM-DD" (specific date)
        - "now" (current time)
        - "2 september" (natural language)
        - Ranges: "start to end", "from start to end"
  process_latency_question:
    type: function
    agents: [parallel_latency_analyzer]
    params:
      description: Sets up the session state to process a single user-provided question within a specific dimension.
  read_report_content:
    type: function
    agents: [parallel_latency_analyzer]
    params:
      description: Reads the current report content from session state (Parallel or Sequential).
  save_analysis_report:
    type: function
    agents: [latency_analyzer, investigator, report_saver, parallel_latency_analyzer]
    params:
      description: "Save the analysis report to a markdown file.\n\nThis tool allows the agent to save its final comprehensive\
        \ report to a file\nfor easy sharing and documentation.\n\nArgs:\n    report_content: The markdown-formatted report\
        \ content to save\n    filename: The filename to save the report as (default: latency_analysis_report.md)\n    \n\
        Returns:\n    A JSON string confirming the save or reporting an error"
  trigger_latency_parallel_report:
    type: function
    agents: [parallel_latency_analyzer]
    params:
      description: Transfers control to the complete_report_generator for parallel processing.
  verify_data_access:
    type: function
    agents: [latency_analyzer, investigator]
    params:
      description: |-
        Verifies BigQuery configuration and data access.

        Use this tool when you encounter "No data found" errors to check:
        1. If the configuration (Project, Dataset, Tables) is correct
        2. If the agent has permissions to access the table
        3. If the table actually contains data

        Returns:
            JSON string with configuration details and test query result

teams:
  agent.build_dimension_team:
    type: sequential
    agents: [agent.build_dimension_team, primer, strategist, loop, writer]
  complete_report_generator:
    type: sequential
    agents: [complete_report_generator, investigation_swarm, final_report_assembler]
  loop:
    type: loop
    agents: [loop, investigator, critique, escalator]
  parallel_latency_analyzer:
    type: hierarchy
    agents: [parallel_latency_analyzer, report_orchestrator]
  report_orchestrator:
    type: sequential
    agents: [report_orchestrator, complete_report_generator, markdown_corrector, report_saver]

