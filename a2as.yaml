  VIEW_ID:
    type: env
    params:
      caller: [os.getenv]
      path: [agents.parallel_latency_analyzer.utils]

files:
  ../../.env:
    type: pattern
    actions: [read]
    params:
      caller: [os.path.join]
      pattern: [__dir__, ../../.env]
  ../../reports:
    type: pattern
    actions: [read]
    params:
      caller: [os.path.join]
      pattern: [os.path.dirname(), ../../reports]
  ./:
    type: pattern
    actions: [read]
    params:
      patterns: ['*.md']
      caller: [run_autonomous_analysis]
  .env:
    type: pattern
    actions: [read]
    params:
      caller: [os.path.join]
      pattern: [__dir__, .env]
  autonomous_analysis_90d.json:
    type: pattern
    actions: [read]
    params:
      caller: [os.path.join, os.path.exists, open, json.load]
      pattern: [os.path.dirname(), autonomous_analysis_90d.json]
  CACHE_DIR:
    type: variable
    actions: [read, delete]
    params:
      caller: [os.path.exists, shutil.rmtree, os.makedirs]
  cache_path:
    type: variable
    actions: [read]
    params:
      caller: [os.path.exists]
  config_path:
    type: pattern
    actions: [read]
    params:
      caller: [os.path.join]
      pattern: [base_dir, config_path]
  env_file:
    type: pattern
    actions: [read]
    params:
      caller: [os.path.join]
      pattern: [__dir__, env_file]
  filepath:
    type: variable
    actions: [write]
    params:
      caller: [open]
      alias: [f]
  LATENCY_ANALYSIS_CONFIG_FILE:
    type: variable
    actions: [read]
    params:
      caller: [os.path.exists, os.path.abspath, open, json.load]
  log_dir:
    type: variable
    actions: [write]
    params:
      caller: [log_dir.mkdir]
  png_dir:
    type: variable
    actions: [read]
    params:
      caller: [os.makedirs]
  replay_file_path:
    type: variable
    actions: [read]
    params:
      caller: [open, json.load, os.path.abspath]
      alias: [f]
  reports_dir:
    type: variable
    actions: [read]
    params:
      caller: [os.makedirs, reports_dir.glob]
  sql/create_latency_view.sql:
    type: variable
    actions: [read]
    params:
      caller: [os.path.exists, ensure_view_exists, open]
  symlink_path:
    type: literal
    actions: [read, delete]
    params:
      caller: [Path(latest_agent.log), symlink_path.unlink]
